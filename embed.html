<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axis</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="../scripts/background.js"></script><script src="../config.js"></script><script src="../scripts/settings.js"></script>
<link rel="stylesheet" href="../styles/main.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../styles/background.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,sans-serif}
#iframe-container{width:100%;height:100%;position:absolute;top:0;left:0;z-index:1;will-change:filter;transform:translateZ(0)}
#embed-frame{width:100%;height:100%;border:none;background:0 0}
.message-container{display:flex;align-items:center;justify-content:center;height:100%;width:100%;color:var(--text);text-align:center;position:fixed;top:0;left:0;z-index:10;background:rgba(10,10,10,.4);backdrop-filter:blur(10px);z-index:10}
.message-content{max-width:400px;padding:20px}
.axis-logo{width:40px;height:40px;margin:0 auto 20px;opacity:.9;color:var(--text,#fff)}.axis-logo path{fill:currentColor}
.message-content h1{font-size:1.25rem;font-weight:600;color:var(--text);margin-bottom:8px}
.message-content p{color:var(--text-muted);font-size:13px;word-break:break-all}
.spinner{border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
#skip-btn,#retry-btn{margin-top:20px;padding:8px 16px;background:0 0;color:var(--text-muted);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px}#skip-btn:hover,#retry-btn:hover{border-color:var(--border-light);color:var(--text)}
body.axis-premium #iframe-container{filter:none!important;transition:none!important}
body.axis-premium .message-container{backdrop-filter:none!important;background:var(--bg)!important}
</style>
<script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
<script type="module">import*as BareMux from"https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";window.BareMux=BareMux;const loadScripts=async()=>{await new Promise(r=>{const s=document.createElement('script');s.src="./script.js";s.onload=r;document.head.appendChild(s)})};window.scriptsLoaded=loadScripts();</script>
</head><body>
<div id="loading" class="message-container"><div class="message-content">
<svg class="axis-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6 L20 6 L12 12 Z"/><path d="M4 18 L20 18 L12 12 Z"/></svg>
<div class="spinner"></div><h1 id="loading-title">Connecting</h1><p id="loading-url">Initializing Axis proxy...</p><button id="skip-btn">Skip</button>
</div></div>
<div id="error" class="message-container" style="display:none"><div class="message-content">
<svg class="axis-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6 L20 6 L12 12 Z"/><path d="M4 18 L20 18 L12 12 Z"/></svg>
<h1>Connection Error</h1><p id="error-message">An error occurred.</p><button id="retry-btn">Retry</button>
</div></div>
<div id="iframe-container"></div>
<script>
if(localStorage.getItem('axisPremium')==='true')document.body.classList.add('axis-premium');
const DEFAULT_WISP=window.SITE_CONFIG?.defaultWisp||"wss://glseries.net/wisp/",WISP_SERVERS=window.SITE_CONFIG?.wispServers||[];
const ERRORS={noUrl:{title:"No URL",message:"Provide a URL.",hint:location.pathname+'#https://example.com'},invalidUrl:{title:"Invalid URL",message:"Not valid.",hint:location.pathname+'#https://google.com'},proxyError:{title:"Proxy Error",message:"Failed to init.",hint:"Check Axis settings."},unknown:{title:"Error",message:"Unexpected error.",hint:"Try again."}};
const els={loading:document.getElementById('loading'),loadingTitle:document.getElementById('loading-title'),loadingUrl:document.getElementById('loading-url'),error:document.getElementById('error'),errorMessage:document.getElementById('error-message'),iframeContainer:document.getElementById('iframe-container'),skipBtn:document.getElementById('skip-btn'),retryBtn:document.getElementById('retry-btn')};
const isValidUrl=u=>{try{const o=new URL(u);return o.protocol==='http:'||o.protocol==='https:'}catch{return false}};
const showContent=()=>{els.loading.style.opacity='0';els.loading.style.visibility='hidden';els.iframeContainer.classList.add('loaded')};
function showError(t,d=''){els.loading.style.display='none';els.error.style.display='flex';const e=ERRORS[t]||ERRORS.unknown;els.errorMessage.innerHTML=`<strong>${e.title}</strong><br>${e.message}<br><small style="color:var(--text-muted)">${e.hint}</small>${d?`<br><code style="font-size:11px;background:var(--surface);padding:4px 8px;border-radius:4px">${d}</code>`:''}`}
let scramjetInstance=null,connectionInstance=null;
async function initScramjet(){if(scramjetInstance)return scramjetInstance;const p=location.pathname.replace(/[^/]*$/,'')+'/';const{ScramjetController}=$scramjetLoadController();scramjetInstance=new ScramjetController({prefix:p+"scramjet",files:{wasm:"https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.wasm.wasm",all:"https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js",sync:"https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.sync.js"}});await scramjetInstance.init();return scramjetInstance}
async function initConn(){if(connectionInstance)return connectionInstance;const p=location.pathname.replace(/[^/]*$/,'')+'/';const w=localStorage.getItem("proxServer")||DEFAULT_WISP;connectionInstance=new BareMux.BareMuxConnection(p+"bareworker.js");await connectionInstance.setTransport("https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs",[{wisp:w}]);return connectionInstance}
async function init(){const t=window.location.hash.substring(1);if(!t)return showError('noUrl');if(!isValidUrl(t))return showError('invalidUrl',t);
try{if('serviceWorker'in navigator){const p=location.pathname.replace(/[^/]*$/,'')+'/';await navigator.serviceWorker.register(p+'sw.js',{scope:p});await navigator.serviceWorker.ready;const w=localStorage.getItem("proxServer")||DEFAULT_WISP;const a=localStorage.getItem('wispAutoswitch')!=='false';navigator.serviceWorker.controller?.postMessage({type:"config",wispurl:w,servers:[...WISP_SERVERS,...JSON.parse(localStorage.getItem('customWisps')||'[]')],autoswitch:a})}
const s=await initScramjet();await initConn();els.loadingTitle.textContent='Loading Site';els.loadingUrl.textContent=t;const f=s.createFrame();f.frame.id='embed-frame';els.iframeContainer.appendChild(f.frame);f.frame.addEventListener('load',showContent);setTimeout(()=>{els.skipBtn.style.display='inline-block';els.skipBtn.onclick=showContent},2000);f.go(t)}catch(e){console.error('Axis Embed Error:',e);showError('unknown',t)}}
els.retryBtn.onclick=()=>location.reload();
async function start(){if(window.scriptsLoaded)await window.scriptsLoaded;init()}window.addEventListener('load',start);
</script></body></html>
