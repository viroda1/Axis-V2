server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ensure proper MIME types for Scramjet/WASM
    types {
        application/javascript js mjs;
        application/wasm wasm;
        application/json json;
        text/css css;
        text/html html;
    }

    # Default routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRITICAL: Never cache the Service Worker or Bare Worker
    location ~* (bareworker|sw)\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Don't cache HTML files so updates apply immediately
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Cache static assets (CSS, standard JS, images) for speed
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
