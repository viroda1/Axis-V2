<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axis v4</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <!-- ===== TOP BAR ===== -->
        <header class="topbar">
            <div class="logo">⚡ Axis v4</div>
            <div class="server-selector">
                <select id="serverSelect" aria-label="Select proxy server"></select>
                <button id="refreshServersBtn" title="Refresh server list">⟳</button>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="dot"></span> <span id="statusText">Connecting...</span>
            </div>
        </header>

        <!-- ===== TAB BAR ===== -->
        <div class="tabs" id="tabBar">
            <div class="tab active" data-tab="0">
                <span class="tab-favicon">🏠</span>
                <span class="tab-title">Home</span>
                <button class="tab-close">×</button>
            </div>
        </div>

        <!-- ===== BROWSER VIEWPORT ===== -->
        <div class="viewport" id="viewport">
            <!-- Home / New Tab content loads here -->
            <iframe id="browserFrame" src="NT.html" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        </div>

        <!-- ===== NAVIGATION BAR ===== -->
        <nav class="navbar">
            <button id="backBtn" title="Go back">◀</button>
            <button id="forwardBtn" title="Go forward">▶</button>
            <button id="refreshBtn" title="Refresh">⟳</button>
            <input type="text" id="urlBar" placeholder="Search or enter URL..." autocomplete="off" />
            <button id="newTabBtn" title="New tab">＋</button>
        </nav>

        <!-- ===== REDEEM PANEL (hidden by default) ===== -->
        <div id="redeemPanel" class="redeem-panel">
            <div class="redeem-inner">
                <h3>⚡ Redeem Speed Code</h3>
                <p>Enter a code to unlock <strong>10× speed</strong> and remove UI lag.</p>
                <div class="redeem-input-group">
                    <input type="text" id="redeemInput" placeholder="XXXX-XXXX-XXXX" maxlength="14" />
                    <button id="redeemBtn">Unlock</button>
                </div>
                <div id="redeemMessage" class="redeem-message"></div>
                <button id="closeRedeemBtn" class="redeem-close">✕</button>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer id="footer">
            <span id="clockDisplay"></span>
            <span id="dateDisplay"></span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
