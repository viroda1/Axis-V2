<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Axis</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#e4e4e7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.nt-logo{width:48px;height:48px;margin-bottom:24px;opacity:.8;color:#e4e4e7;transition:.15s}.nt-logo:hover{opacity:1;color:#fff}.nt-logo path{fill:currentColor}
.clock{font-size:4rem;font-weight:600;letter-spacing:-2px;margin-bottom:4px;color:#fff}
.date{font-size:14px;color:#71717a;margin-bottom:32px;font-weight:500}
.search-box{display:flex;align-items:center;gap:8px;background:#0f0f0f;border:1px solid #1f1f1f;border-radius:12px;padding:12px 16px;width:100%;max-width:500px;margin-bottom:40px}
.search-box input{flex:1;background:0 0;border:none;outline:none;color:#e4e4e7;font-size:14px;font-family:inherit}.search-box input::placeholder{color:#52525b}
.search-box select{background:#1a1a1a;border:none;border-radius:6px;color:#71717a;padding:6px 10px;font-size:12px;cursor:pointer;outline:none}
.shortcuts{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;max-width:500px;width:100%}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.shortcut-icon{width:52px;height:52px;background:#0f0f0f;border:1px solid #1f1f1f;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:.15s}
.shortcut:hover .shortcut-icon{background:#1a1a1a;transform:translateY(-2px)}
.shortcut-icon img{width:22px;height:22px;filter:brightness(0) invert(.7)}.shortcut-icon i{font-size:20px;color:#71717a}
.shortcut-label{font-size:11px;color:#71717a;text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shortcut:hover .shortcut-label{color:#e4e4e7}
.bottom-actions{position:fixed;bottom:24px;display:flex;gap:16px;align-items:center}
.quote{font-size:13px;color:#52525b;max-width:300px;text-align:center}
.redeem-btn{font-size:12px;color:#52525b;background:#0f0f0f;border:1px solid #1f1f1f;padding:6px 12px;border-radius:6px;cursor:pointer}.redeem-btn:hover{color:#e4e4e7;border-color:#2a2a2a}
.loader{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}.loader.show{display:flex}
.spinner{width:32px;height:32px;border:2px solid #1f1f1f;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="loader" id="loader"><div class="spinner"></div></div>
<svg class="nt-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6 L20 6 L12 12 Z"/><path d="M4 18 L20 18 L12 12 Z"/></svg>
<div class="clock" id="clock">12:00 AM</div>
<div class="date" id="date">Loading...</div>
<form class="search-box" id="searchForm"><i class="fa-solid fa-magnifying-glass" style="color:#71717a;font-size:14px"></i>
<input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">
<select id="engine"><option value="https://search.brave.com/search?q=">Brave</option><option value="https://duckduckgo.com/?q=">DuckDuckGo</option><option value="https://www.google.com/search?q=">Google</option></select></form>
<div class="shortcuts" id="shortcuts">
<a class="shortcut" data-url="https://youtube.com"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg"></div><span class="shortcut-label">YouTube</span></a>
<a class="shortcut" data-url="https://github.com"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg"></div><span class="shortcut-label">GitHub</span></a>
<a class="shortcut" data-url="https://discord.com"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg"></div><span class="shortcut-label">Discord</span></a>
<a class="shortcut" data-url="https://twitter.com"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg"></div><span class="shortcut-label">Twitter</span></a>
<a class="shortcut" data-url="https://reddit.com"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/reddit.svg"></div><span class="shortcut-label">Reddit</span></a>
<a class="shortcut" data-url="https://spotify.com"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/spotify.svg"></div><span class="shortcut-label">Spotify</span></a>
<a class="shortcut" data-url="https://netflix.com"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/netflix.svg"></div><span class="shortcut-label">Netflix</span></a>
<a class="shortcut" data-url="https://twitch.tv"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitch.svg"></div><span class="shortcut-label">Twitch</span></a>
<a class="shortcut" data-url="https://mail.google.com"><div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg"></div><span class="shortcut-label">Gmail</span></a>
<div class="shortcut" id="addShortcut"><div class="shortcut-icon"><i class="fa-solid fa-plus"></i></div><span class="shortcut-label">Add</span></div>
</div>
<div class="bottom-actions"><div class="quote" id="quote"></div>
<button class="redeem-btn" onclick="window.parent.postMessage({type: 'openRedeem'}, '*')"><i class="fa-solid fa-bolt"></i> Redeem Code</button></div>
<script>
const $=s=>document.querySelector(s);const nav=url=>{$('#loader').classList.add('show');window.parent?.postMessage({type:'navigate',url},'*')};
function updateClock(){const now=new Date();$('#clock').textContent=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});$('#date').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
updateClock();setInterval(updateClock,1000);
 $('#searchForm').onsubmit=e=>{e.preventDefault();const q=$('#searchInput').value.trim();if(q)nav($('#engine').value+encodeURIComponent(q))};
 $('#shortcuts').onclick=e=>{const s=e.target.closest('.shortcut[data-url]'),a=e.target.closest('#addShortcut');if(s){e.preventDefault();nav(s.dataset.url)}else if(a){const n=prompt("Shortcut name:");if(!n)return;let u=prompt("URL:");if(!u)return;if(!u.startsWith('http'))u='https://'+u;const sc=JSON.parse(localStorage.getItem('shortcuts')||'[]');sc.push({name:n,url:u});localStorage.setItem('shortcuts',JSON.stringify(sc));renderCustom()}};
function renderCustom(){document.querySelectorAll('.custom-shortcut').forEach(e=>e.remove());const sc=JSON.parse(localStorage.getItem('shortcuts')||'[]'),a=$('#addShortcut');sc.forEach(s=>{const d=document.createElement('div');d.className='shortcut custom-shortcut';d.dataset.url=s.url;d.innerHTML=`<div class="shortcut-icon"><i class="fa-solid fa-link"></i></div><span class="shortcut-label">${s.name}</span>`;a.before(d)})}
const q=["so tuff","it is what it is","do ur work","touch grass","FULL BOX","200!","ctrl+x to hide screen","change tab title in settings","TEACHERR!","lebron james"];$('#quote').textContent=q[Math.floor(Math.random()*q.length)];renderCustom();
</script></body></html>
